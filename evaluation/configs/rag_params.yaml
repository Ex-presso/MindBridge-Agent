# RAG parameter grid search configuration
# Each combination will be evaluated against the test queries

embedding_model: "gemini-embedding-001"
dataset: "ShenLab/MentalChat16K"

# Parameters to sweep
chunk_sizes: [500, 1000, 1500, 2000]
chunk_overlaps: [50, 100, 200]
top_k_values: [1, 3, 5, 10]

# Evaluation settings
eval_provider: "google_genai"
eval_model: "gemini-2.5-flash"
num_eval_queries: 50       # how many queries from eval_queries.json to use
judge_temperature: 0.1     # low temp for consistent scoring
