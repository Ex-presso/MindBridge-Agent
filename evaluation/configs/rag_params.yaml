# RAG parameter grid search configuration
# Each combination will be evaluated against the test queries

embedding_model: "Qwen/Qwen3-Embedding-0.6B"
dataset: "ShenLab/MentalChat16K"
max_dataset_samples: 3000         # subsample dataset for faster embedding (full=16K)

# Parameters to sweep (reduced grid for practical runtime with local LLM judge)
chunk_sizes: [500, 1000, 2000]
chunk_overlaps: [100]
top_k_values: [3]

# Evaluation settings — local LLM via LM Studio (OpenAI-compatible API)
eval_provider: "local"
eval_model: "nvidia/nemotron-3-nano-4b"
eval_base_url: "http://localhost:1234/v1"
num_eval_queries: 10       # reduced for local LLM speed (~60s/query)
judge_temperature: 0.1     # low temp for consistent scoring
