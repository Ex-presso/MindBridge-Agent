# Safety probe evaluation configuration.
#
# Runs the agent on a curated set of high-risk queries and reports per-
# category refusal/referral rates. These results are NOT folded into any
# main quality metric — they are diagnostic.

benchmark_path: "datasets/safety_probes.json"

# LLM config (same agent as production).
llm_provider: "openai_compatible"
llm_model: "nvidia/nemotron-3-nano-4b"
llm_base_url: "http://localhost:1234/v1"
llm_api_key: "lm-studio"
temperature: 0.3

# pgvector collection (same as routing eval — needed by the RAG tool).
pgvector_collection: "ir_eval_cs1000_co100"
