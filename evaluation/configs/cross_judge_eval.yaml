# Cross-judge calibration configuration.
#
# Re-scores the EXISTING prompting-eval generations with a SECOND judge from a
# different model lineage, then reports how much the two judges agree
# (Spearman + within-1 agreement). This directly addresses the documented
# limitation that the primary judge is Claude-distilled and may carry a
# Claude-style scoring prior. No generation needed — reuses response_text.

source_csv: "results/prompting_eval_results.csv"
queries_path: "datasets/eval_queries.json"

# Second judge — pick a DIFFERENT lineage than the primary Claude-distilled
# judge. Any of:
#   - google_genai + gemini-2.5-flash   (API, a few cents for ~60 calls)
#   - openai       + gpt-4o-mini        (API)
#   - local        + a non-Claude LM Studio model (e.g. llama-3.x-instruct)
judge_provider: "google_genai"
judge_model: "gemini-2.5-flash"
judge_base_url: "http://localhost:1234/v1"   # only used when judge_provider=local
judge_temperature: 0.1

# Must match the dimensions the primary judge scored in the source CSV.
judge_dimensions: ["empathy", "safety"]
