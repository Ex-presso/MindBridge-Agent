services:
  postgres:
    image: pgvector/pgvector:pg16
    container_name: mindbridge-postgres
    environment:
      POSTGRES_USER: mindbridge
      POSTGRES_PASSWORD: mindbridge_dev
      POSTGRES_DB: mindbridge
    ports:
      - "5432:5432"
    volumes:
      - mindbridge_pgdata:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U mindbridge"]
      interval: 5s
      timeout: 5s
      retries: 5

  backend:
    build:
      context: ./backend
      dockerfile: Dockerfile
    container_name: mindbridge-backend
    ports:
      - "8080:8080"
    env_file:
      - ./backend/.env
    environment:
      DATABASE_URL: postgresql+psycopg://mindbridge:mindbridge_dev@postgres:5432/mindbridge
      HOST: 0.0.0.0
    depends_on:
      postgres:
        condition: service_healthy
    restart: unless-stopped

  frontend:
    build:
      context: ./frontend-next
      dockerfile: Dockerfile
    container_name: mindbridge-frontend
    ports:
      - "3000:3000"
    environment:
      NEXT_PUBLIC_API_URL: http://localhost:8080
    depends_on:
      - backend
    restart: unless-stopped

  # Optional. Start with `docker compose --profile observability up -d` and set
  # OTEL_EXPORTER_OTLP_ENDPOINT=http://jaeger:4318 in backend/.env.
  jaeger:
    image: jaegertracing/jaeger:2.22.0
    container_name: mindbridge-jaeger
    profiles: ["observability"]
    ports:
      - "16686:16686" # trace UI
      - "4318:4318" # OTLP/HTTP ingest

  prometheus:
    image: prom/prometheus:v3.15.1
    container_name: mindbridge-prometheus
    profiles: ["observability"]
    ports:
      - "9090:9090"
    volumes:
      - ./ops/prometheus.yml:/etc/prometheus/prometheus.yml:ro

volumes:
  mindbridge_pgdata:
