services:
  postgres:
    image: pgvector/pgvector:pg16
    container_name: mindbridge-postgres
    environment:
      POSTGRES_USER: mindbridge
      POSTGRES_PASSWORD: mindbridge_dev
      POSTGRES_DB: mindbridge
    ports:
      - "5432:5432"
    volumes:
      - mindbridge_pgdata:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U mindbridge"]
      interval: 5s
      timeout: 5s
      retries: 5

  # Rate limit counters and the idempotency keys of background jobs.
  redis:
    image: redis:7-alpine
    container_name: mindbridge-redis
    ports:
      - "6379:6379"
    healthcheck:
      test: ["CMD", "redis-cli", "ping"]
      interval: 5s
      timeout: 5s
      retries: 5

  # Queue for background memory jobs. Management UI on port 15672.
  rabbitmq:
    image: rabbitmq:4.3-management
    container_name: mindbridge-rabbitmq
    environment:
      RABBITMQ_DEFAULT_USER: mindbridge
      RABBITMQ_DEFAULT_PASS: mindbridge_dev
    ports:
      - "5672:5672"
      - "15672:15672"
    volumes:
      - mindbridge_rabbitmq:/var/lib/rabbitmq
    healthcheck:
      test: ["CMD", "rabbitmq-diagnostics", "-q", "ping"]
      interval: 10s
      timeout: 10s
      retries: 10

  backend:
    build:
      context: ./backend
      dockerfile: Dockerfile
    container_name: mindbridge-backend
    ports:
      - "8080:8080"
    env_file:
      - ./backend/.env
    environment:
      DATABASE_URL: postgresql+psycopg://mindbridge:mindbridge_dev@postgres:5432/mindbridge
      REDIS_URL: redis://redis:6379/0
      RABBITMQ_URL: amqp://mindbridge:mindbridge_dev@rabbitmq:5672/
      HOST: 0.0.0.0
    depends_on:
      postgres:
        condition: service_healthy
      redis:
        condition: service_healthy
      rabbitmq:
        condition: service_healthy
    restart: unless-stopped

  frontend:
    build:
      context: ./frontend-next
      dockerfile: Dockerfile
    container_name: mindbridge-frontend
    ports:
      - "3000:3000"
    environment:
      NEXT_PUBLIC_API_URL: http://localhost:8080
    depends_on:
      - backend
    restart: unless-stopped

  # Optional. Start with `docker compose --profile observability up -d` and set
  # OTEL_EXPORTER_OTLP_ENDPOINT=http://jaeger:4318 in backend/.env.
  jaeger:
    image: jaegertracing/jaeger:2.22.0
    container_name: mindbridge-jaeger
    profiles: ["observability"]
    ports:
      - "16686:16686" # trace UI
      - "4318:4318" # OTLP/HTTP ingest

  prometheus:
    image: prom/prometheus:v3.15.1
    container_name: mindbridge-prometheus
    profiles: ["observability"]
    ports:
      - "9090:9090"
    volumes:
      - ./ops/prometheus.yml:/etc/prometheus/prometheus.yml:ro

volumes:
  mindbridge_pgdata:
  mindbridge_rabbitmq:
