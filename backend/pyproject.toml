[project]
name = "mindbridge_agent"
version = "0.1.0"
description = "A mental health counseling agent, buid with Fastapi, LangGraph, and RAG."
readme = "README.md"
requires-python = ">=3.12"
dependencies = [
    "datasets>=4.2.0",
    "dotenv>=0.9.9",
    "faiss-cpu>=1.12.0",
    "fastapi>=0.119.0",
    "langchain-community>=0.3.31",
    "langchain-anthropic>=0.3.0",
    "langchain-openai>=0.3.35",
    "langchain-postgres>=0.0.13",
    "langchain-text-splitters>=0.3.11",
    "langchain[google-genai]>=0.3.27",
    "langgraph>=0.6.10",
    "langgraph-checkpoint-postgres>=2.0.0",
    "psycopg[binary,pool]>=3.1.0",
    "pydantic>=2.12.2",
    "tqdm>=4.67.1",
    "uvicorn>=0.37.0",
    "python-jose[cryptography]>=3.3.0",
    "bcrypt>=4.0.0",
    "slowapi>=0.1.9",
    "alembic>=1.14.0",
    "sqlalchemy[asyncio]>=2.0.0",
    "asyncpg>=0.30.0",
    "email-validator>=2.2.0",
    "pydantic-settings>=2.0.0",
]

[tool.uv]
dev-dependencies = [
    "pytest>=8.0.0",
    "pytest-asyncio>=0.23.0",
    "httpx>=0.27.0",
]
