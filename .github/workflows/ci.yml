name: CI

on:
  push:
    branches: [main, dev]
  pull_request:

jobs:
  ci:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: astral-sh/setup-uv@v5
        with:
          python-version: "3.12"

      # Backend holds the default ruff baseline; evaluation/analysis scripts
      # only gate on critical errors (syntax, undefined names).
      - name: Lint
        run: |
          uvx ruff check backend
          uvx ruff check --select E9,F63,F7,F82 evaluation analysis

      - name: Backend tests
        working-directory: backend
        run: |
          uv sync --frozen
          uv run pytest -q
